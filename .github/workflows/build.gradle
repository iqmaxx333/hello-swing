name: Build Fabric Mod

on:
  push:
    branches: [ "main" ] # Или твоя основная ветка
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:      # <--- Добавь эту строку! Это и есть кнопка
    jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradle executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Jar
          path: build/libs/*.jar
          
